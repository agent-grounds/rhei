# fissile configuration (fissile's own FS-001-config).
#
# Every value is written explicitly at its default so the file is editable in
# place without consulting the spec. The generated defaults are deliberately
# generic; the rules below are tuned to this repository — §AR-source-file-size
# is the policy this file enforces.

fissile_config_version = 1

[scan]
# `audit` walks these roots; `check --staged` ignores them and takes its file
# set from git. Both honor `exclude` and `.gitignore`. The whole repository is
# in scope: `.gitignore` already keeps `target/`, `panta/`, and `scratchpad/`
# out, so narrowing by directory would only hide crates like `xtask/`.
include = ["."]
exclude = [
  "target/**",
  "node_modules/**",
  ".git/**",
  "dist/**",
  "build/**",
  "vendor/**",
  "**/*.lock",
  "**/*.min.*",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
  # An append-only release record has no split to ask for. `docs/changelog.md`
  # carries the current release, and `docs/changelog/` only
  # grows as the release archives what it displaces (§FS-rhei-distribution.5),
  # so a line budget here would report a finding no edit can answer.
  "docs/changelog.md",
  "docs/changelog/**",
  # Generated, vendored, and snapshot payloads are not hand-edited surfaces.
  "**/target/**",
  "**/*.snap",
]
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto"  # auto | always | never
success = "ok"

[exceptions]
soft_registry = "docs/file-size-agent-exceptions.toml"
hard_registry = "docs/file-size-human-exceptions.toml"
# What to do about an exception entry that has outlived its file. Both `check`
# and `audit --stale-exceptions` report under this key, so `error` fails a
# commit as well as a CI audit.
stale = "warn" # warn | error | ignore

# A ceiling written by `exception add` or `exception retune` is rounded up to
# this step, so it reads as a decision rather than as whatever the file measured
# that day. The same step is the slack `audit --stale-exceptions` tolerates
# before calling a ceiling loose. Set a unit to 1 to record exact measurements.
[exceptions.bump]
lines = 100
bytes = 4096
tokens = 1000

[tokens]
# Token budgets are opt-in; bytes and lines work without external tooling.
enabled = false
command = ["token-counter", "--count", "{path}"]

# Messages are the part of this file worth rewriting first: they are what the
# check teaches when it fires. Replace them with guidance that names real
# destinations ("move transport code under src/api/"), and point at the
# architecture document that decides where extracted code belongs. Cite only IDs
# declared in *this* repository; an ID borrowed from another project resolves
# nowhere here.
#
# Soft and hard are separate messages on purpose: a warning asks for a split
# next time the file is touched, a block has to say what to do when no safe
# split exists. Keep both escape hatches in the text — a rule that only ever
# says "split this" gets satisfied by bad splits.
#
# Where a message names the exception route, keep it saying what the reason has
# to establish, not merely that a reason is required: "record the debt" reads as
# satisfied by any sentence, and what comes back is a description of the file.
#
# `{path}` and `{actual}` differ per file, so a message using either is printed
# once per file instead of once per group. `{rule}`, `{severity}`, `{limit}`,
# and `{unit}` are constant within a group and stay grouped.

[[messages]]
id = "split-source-soft"
text = """
Should split, next time you are in one of these files: move a cohesive group of items into a sibling module. Split along a responsibility seam named by §AR-source-file-size.3, never at the line count, and never break apart code that belongs together.
If no split leaves the design better than it is now, record why instead of forcing one — not what the file contains, which is what this finding already said. Name the constraint that makes splitting illegal (--kind structural), or the boundary that is missing and what must exist first (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-source-hard"
text = """
Must split before more code lands here: move cohesive groups of items into sibling modules along seams that already exist (§AR-source-file-size.3). Do not invent an abstraction, flatten a boundary, or shuffle lines to get under the limit — a worse design under budget is not the goal.
If you cannot see a split that leaves the architecture intact, stop and ask a human. The only other way past this gate is a human-reviewed exception, whose reason names the constraint that makes splitting illegal (--kind structural) or the boundary that is missing and what must exist first (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[messages]]
id = "large-file-soft"
text = """
Large for a hand-written file. If it is generated, vendored, or binary, add it to [scan].exclude — the budget system should not reason about it at all. If it is real content, give it a rule of its own with a limit and guidance that fit it.
"""

[[messages]]
id = "large-file-hard"
text = """
Very large file. Exclude it in [scan].exclude if it is generated, vendored, or binary; give it its own rule if this file type is simply bigger than the catch-all assumes.
If it is hand-written content that has to stay this size, that is a human's call, and the exception names what makes it indivisible (--kind structural) or what must exist before it can be split (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-spec-soft"
text = """
Should split, next time you are in this document: at this length it is usually covering two subjects. Split at a section boundary that already exists — lift a top-level section into a document of its own with its own grund declaration, and leave a citation where it was. Never split at the line count: a citation that stops resolving costs every later reader more than the extra lines ever did, so move whole sections and fix the `§` markers that pointed into them.
If this really is one subject and every section is part of it, record why instead of forcing a split — not what the document contains, which is what this finding already said. Name the constraint that makes splitting illegal (--kind structural), or the boundary that is missing and what must exist first (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-spec-hard"
text = """
Must split before more text lands here: this has stopped being a document. Move the secondary detail into a child declaration — its own file under the same kind, cited from the section it left — and keep every citation resolvable: `grund <ID>.<section>` must still reach the text it named, and `grund check` is what proves it. Do not compress prose or drop the examples to get under the limit; a shorter document that answers less is not the goal.
If you cannot see a split that leaves the declarations coherent, stop and ask a human. The only other way past this gate is a human-reviewed exception, whose reason names the constraint that makes splitting illegal (--kind structural) or the boundary that is missing and what must exist first (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[messages]]
id = "trim-entrypoint-soft"
text = """
Should shorten, next time you are in this file: an entrypoint is loaded whole into every session that starts here, so every line is charged to every read. Move a section into a document that can be reached by citation instead — a spec under `docs/` with a grund declaration — and leave the orientation and the link behind.
If everything here has to be in the session from the first token, record why instead of trimming to fit: name the constraint that makes it indivisible (--kind structural), or the document it should move into that does not exist yet (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "trim-entrypoint-hard"
text = """
Must shorten before more text lands here: this file is read in full by every session that starts from it. Move whole sections into documents reached by citation and leave the links behind. Do not squeeze the prose or delete the examples to get under the limit — an entrypoint that no longer orients anyone is worse than a long one.
If it cannot be shortened without losing what a session needs before it can do anything, that is a human's call, and the exception names what makes the content indivisible (--kind structural) or what must exist before it can move (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[rules]]
id = "large-file-default"
include = ["**/*"]
unit = "bytes"
soft = 524288
hard = 1048576
soft_message = "large-file-soft"
hard_message = "large-file-hard"

# The budgets are not a new opinion. §AR-source-file-size.1 already says a
# hand-authored source, template, example, or test file is kept in the 500-line
# range, that 500-2000 needs a register entry, and that above 2000 is not
# allowed. That rule had no enforcement; this config is the enforcement.
#
# Hand-written source, matched by extension so the budget follows the code
# wherever it lives. `.yaml` and `.sh` are here because §AR-source-file-size.1
# names templates and examples: this repository's state machines are
# hand-authored `states.yaml` files, not generated data. Generated formats
# (`.json`, `.sql`, `.csv`) are deliberately absent — they fall to the byte
# catch-all, because a large generated file is not the same problem as a large
# hand-written module.
[[rules]]
id = "source"
include = [
  "**/*.rs", "**/*.go", "**/*.py", "**/*.rb", "**/*.php",
  "**/*.java", "**/*.kt", "**/*.kts", "**/*.scala", "**/*.swift", "**/*.cs",
  "**/*.c", "**/*.h", "**/*.cc", "**/*.cpp", "**/*.cxx", "**/*.hpp",
  "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx",
  "**/*.vue", "**/*.svelte", "**/*.lua", "**/*.ex", "**/*.exs", "**/*.dart",
  "**/*.sh", "**/*.yaml", "**/*.yml",
]
unit = "lines"
soft = 500
hard = 2000
count_blank_lines = false
count_comment_lines = true
soft_message = "split-source-soft"
hard_message = "split-source-hard"


# Budget follows how a document is read. A citable spec — a grund-declared
# document reached by `§ID.section` — is fetched a section at a time with
# `grund <ID>.<section>` and is never read whole, so its length is not charged
# to every read the way a source file's is. That argues for a bigger budget, not
# for no budget, which is what this repository had: `**/*.spec.md` sat in
# [scan].exclude and the spec tree was never measured once (#130).
#
# 750 soft is grund's own soft value, and about three times the p95 of the
# fissile, grund, and ephor spec trees — it fires on a document that has taken
# on a second subject, not on a thorough one. 2000 hard is the ceiling
# §AR-source-file-size.1 already declares for any hand-authored file; here it is
# the backstop for a document that has stopped being a document.
[[rules]]
id = "citable-spec"
include = ["docs/**/*.md", "**/*.spec.md"]
unit = "lines"
soft = 750
hard = 2000
count_blank_lines = false
count_comment_lines = true
soft_message = "split-spec-soft"
hard_message = "split-spec-hard"

# The other half of the same reasoning. An entrypoint is not fetched by section:
# README.md, AGENTS.md, CLAUDE.md, and the skills are loaded whole into every
# session that starts from them, so the read cost is the whole file, every time.
# 250/500 is the tight budget that follows.
#
# `priority` is what decides this rule over `citable-spec` for the index READMEs
# under `docs/`: neither glob is more specific than the other, and without a
# priority that overlap is an ambiguity error rather than a choice
# (fissile spec FS-001-config.3.2).
[[rules]]
id = "entrypoint-doc"
include = [
  "README.md", "AGENTS.md", "CLAUDE.md",
  "**/README.md", "**/AGENTS.md", "**/CLAUDE.md",
  "**/skills/**/*.md",
]
unit = "lines"
soft = 250
hard = 500
count_blank_lines = false
count_comment_lines = true
priority = 10
soft_message = "trim-entrypoint-soft"
hard_message = "trim-entrypoint-hard"
