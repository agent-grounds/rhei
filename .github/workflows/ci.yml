name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Two jobs that run in parallel, so the wall clock is the slowest *test* job
# rather than the test job plus every repository gate stacked on top of it.
# Both stay inside this one workflow: the release helpers look the green run
# up by workflow name. §AR-ci-release.1
jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: clippy, rustfmt

      # The end-to-end suite stands its mock agents, programs, and callbacks up
      # as Python scripts, which is what lets one test command run on all three
      # platforms. Every runner image ships a Python already; pinning it here
      # says the suite depends on one rather than leaving it to the image.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Credential, egress and process-tree confinement is proved by breaching
      # it, so the Linux runner needs the launcher those cases confine with.
      # A runner without it cannot prove containment, and the cases say so
      # rather than passing quietly. §FS-rhei-budgets.6.4
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor,
          # which is the very mechanism the containment cases confine with.
          # Kernels without the knob need no relaxing, so a missing key is not
          # a failure.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::all

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test
        timeout-minutes: 45
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  lint:
    name: repository gates (grund, fissile, lychee, changelog, attribution)
    runs-on: ubuntu-latest
    env:
      GRUND_VERSION: 0.13.2-dev
      GRUND_REVISION: 89d7a65232868f1ce1033a0678298dade40fb9d5
      GRUND_REPOSITORY: https://github.com/agent-grounds/grund.git
      LYCHEE_VERSION: 0.23.0
      FISSILE_VERSION: 0.8.3
      TOOLS_ROOT: ${{ github.workspace }}/.ci-tools
    steps:
      - uses: actions/checkout@v6

      - name: Install current stable Rust for tooling
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # The gate binaries are compiled from source on a cache miss only. They
      # live under their own root so the cache never touches rustup's proxies
      # in ~/.cargo/bin; the key is the pinned versions, so bumping one rebuilds.
      - name: Cache gate tool binaries
        id: tools-cache
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ env.TOOLS_ROOT }}
          key: ${{ runner.os }}-gate-tools-grund-${{ env.GRUND_VERSION }}-${{ env.GRUND_REVISION }}-lychee-${{ env.LYCHEE_VERSION }}-fissile-${{ env.FISSILE_VERSION }}

      - name: Install gate tools
        shell: bash
        run: |
          set -euo pipefail
          install_tool() {
            local name="$1" version="$2"
            if [ -x "$TOOLS_ROOT/bin/$name" ]; then
              echo "$name $version: cached"
            elif [ "$name" = grund ]; then
              cargo +stable install "$name" --git "$GRUND_REPOSITORY" --rev "$GRUND_REVISION" --locked --root "$TOOLS_ROOT"
            else
              cargo +stable install "$name" --version "$version" --locked --root "$TOOLS_ROOT"
            fi
          }
          install_tool grund "$GRUND_VERSION"
          install_tool lychee "$LYCHEE_VERSION"
          install_tool fissile "$FISSILE_VERSION"
          echo "$TOOLS_ROOT/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet pre-commit

      - name: grund config validate
        run: grund config validate

      - name: grund check
        run: grund check .

      # The hook contract, minus the cargo hooks the test job already ran on
      # three platforms: running them here again would run the suite twice.
      - name: pre-commit (repository gates)
        env:
          SKIP: cargo-fmt-check,cargo-clippy,cargo-build,cargo-test
        run: pre-commit run --all-files --show-diff-on-failure

      - name: changelog PR entry
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog_pr_entry.py --pr-number "${{ github.event.pull_request.number }}"
