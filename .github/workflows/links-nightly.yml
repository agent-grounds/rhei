# What still asks about every external link, on main's head. §AR-ci-release.5
# No pull request and no required check depends on it; the one open issue it files is the record.
name: Nightly link sweep

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: every external link
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.23.0
    steps:
      # By name, so a dispatch from another branch still judges main's links.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install current stable Rust for tooling
        uses: dtolnay/rust-toolchain@stable

      - name: Install lychee
        run: cargo +stable install lychee --version "$LYCHEE_VERSION" --locked

      # A 5xx that passes by says nothing about the link, so only a link failing on both passes counts.
      # `shell: bash` is what sets pipefail: without it the `tee` would lose lychee's exit code.
      - name: Ask about every external link
        id: sweep
        shell: bash
        env:
          # lychee reads it for GitHub's authenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sweep() {
            lychee --no-progress --include-fragments README.md docs examples packages 2>&1 | tee "$RUNNER_TEMP/link-sweep-$1.txt"
          }
          failing() {
            sed -n 's/^\[[^]]*\] \([^ ]*\) | .*/\1/p' "$RUNNER_TEMP/link-sweep-$1.txt" | sort -u
          }
          if sweep first; then
            exit 0
          fi
          echo "The first pass failed. Asking again after a pause: only a link failing on both passes counts."
          sleep 300
          second=0
          sweep second || second=$?
          if [ "$second" -eq 0 ]; then
            exit 0
          fi
          # A failing pass that names no link is lychee failing, and the filing step reads no list as that.
          if [ -z "$(failing first)" ] || [ -z "$(failing second)" ]; then
            echo "lychee itself failed, so the two passes cannot be compared."
            exit "$second"
          fi
          comm -12 <(failing first) <(failing second) > "$RUNNER_TEMP/link-sweep-both.txt"
          if [ ! -s "$RUNNER_TEMP/link-sweep-both.txt" ]; then
            echo "No link failed on both passes."
            exit 0
          fi
          echo "These links failed on both passes:"
          cat "$RUNNER_TEMP/link-sweep-both.txt"
          exit 1

      # One open issue: a later failure comments on it rather than opening a second.
      - name: File the failing links
        if: failure() && steps.sweep.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Nightly link sweep: external links failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/link-sweep-issue.md"
          both="$RUNNER_TEMP/link-sweep-both.txt"
          commit=$(git rev-parse --short HEAD)
          quote() {
            echo '```text'
            cat "$RUNNER_TEMP/link-sweep-$1.txt"
            echo '```'
          }
          {
            if [ -s "$both" ]; then
              echo "The [nightly link sweep]($RUN_URL) on \`$commit\` found these links failing on both of its passes:"
              echo
              echo '```text'
              cat "$both"
              echo '```'
              echo
              echo "What lychee said on the second pass, which may also name a link that failed only there:"
              echo
              quote second
            else
              echo "lychee itself failed in the [nightly link sweep]($RUN_URL) on \`$commit\`, so its two passes could not be compared. What it printed on the first pass:"
              echo
              quote first
              echo
              echo "And on the second:"
              echo
              quote second
            fi
          } > "$body"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label bug --body-file "$body"
          fi
