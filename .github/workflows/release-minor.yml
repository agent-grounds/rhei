name: Release minor

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # Resolving a changelog bullet's commit to its pull request is a forge read.
  # §AR-ci-release.3
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  minor-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Resolve current and next versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "error: no v*.*.* tag exists; bootstrap the first release manually" >&2
            exit 1
          fi
          current="${tag#v}"
          IFS=. read -r major minor patch <<< "$current"
          next="${major}.$((minor + 1)).0"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Gate - commits since last tag
        shell: bash
        run: |
          set -euo pipefail
          count="$(git rev-list --count "${{ steps.versions.outputs.current_tag }}"..HEAD)"
          if [ "$count" -eq 0 ]; then
            echo "error: no commits since ${{ steps.versions.outputs.current_tag }}" >&2
            exit 1
          fi

      - name: Gate - CI on current main tip is green
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          run="$(gh run list --workflow=CI --branch=main --limit=20 \
            --json status,conclusion,headSha,databaseId \
            | jq -c ".[] | select(.headSha == \"$sha\")" | head -n1)"
          if [ -z "$run" ]; then
            echo "error: no CI run found for HEAD ($sha)" >&2
            exit 1
          fi
          status="$(echo "$run" | jq -r '.status')"
          conclusion="$(echo "$run" | jq -r '.conclusion')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "error: CI on $sha is $status/$conclusion (need completed/success)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Bump package versions and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          python3 scripts/set-release-version.py "$next"
          cargo update --workspace
          # Before the promotion, so the numbers are resolved from the
          # commits the bullets were written in. §FS-rhei-distribution.5.2
          python3 scripts/prepare_changelog_release.py stamp
          python3 scripts/prepare_changelog_release.py prepare "$next"
          # Fail here rather than three minutes into the dry run: this is the
          # same check `release.yml` opens with, and it is cheap.
          python3 scripts/verify-release-version.py "$next"

      - name: Commit and push release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="release-candidate/v${next}-${GITHUB_RUN_ID}"
          base_sha="$(git rev-parse HEAD)"

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage what the bump touched rather than a list that has to be kept
          # in step with it: the list dropped `xtask/Cargo.toml` — the one
          # manifest outside `crates/` — and committed a bumped lockfile beside
          # a stale `=` pin, which `verify-release-version.py` then rejected.
          git add -A
          git commit -m "Release v${next}"
          git push -u origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dry-run release workflow
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="${{ steps.candidate.outputs.branch }}"
          sha="${{ steps.candidate.outputs.sha }}"

          gh workflow run release.yml \
            --ref "$branch" \
            -f version="$next" \
            -f publish_crates=false \
            -f create_github_release=false

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow=release.yml --branch="$branch" --event=workflow_dispatch --limit=20 \
              --json databaseId,headSha \
              | jq -r ".[] | select(.headSha == \"$sha\") | .databaseId" \
              | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "error: dispatched release dry run for $branch but could not find the run" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30

      - name: Publish release commit and dispatch release
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="${{ steps.candidate.outputs.branch }}"
          base_sha="${{ steps.candidate.outputs.base_sha }}"
          sha="${{ steps.candidate.outputs.sha }}"

          git fetch origin main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$base_sha" ]; then
            echo "error: main moved from $base_sha to $current_main while release dry run was running" >&2
            exit 1
          fi

          git push origin "${sha}:refs/heads/main"
          gh workflow run release.yml \
            --ref main \
            -f version="$next" \
            -f publish_crates=true \
            -f create_github_release=true
          git push origin --delete "$branch" || true

      - name: Advance main to the next dev version
        shell: bash
        run: |
          set -euo pipefail
          released="${{ steps.versions.outputs.next }}"
          IFS=. read -r major minor patch <<< "$released"
          dev="${major}.${minor}.$((patch + 1))-dev"
          # Main must not keep the version it just released: a build from main is
          # otherwise indistinguishable from the tag it is ahead of.
          git fetch origin main
          git checkout -B main refs/remotes/origin/main
          python3 scripts/set-release-version.py "$dev"
          cargo update --workspace --offline || cargo update --workspace
          git add Cargo.toml crates/*/Cargo.toml xtask/Cargo.toml Cargo.lock packages
          git commit -m "Open ${dev} for development"
          git push origin main
