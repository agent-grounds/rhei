# Reusable fix duties and stage contracts. §FS-rhei-library.7.2
name: fix
version: 1.0.0
# Bind runtime tokens for the later runtime pass. §FS-rhei-states.4.4
states:
{% if fix_prepare != 'none' %}
  prepare-workspace:
    description: Set up an isolated workspace ({{fix_prepare}}) before applying final fixes.
    target: {{smart_target}}
    inputs:
      - name: final-decision
        path: runtime/decisions/{task_id}-final-decision.md
    prompt_template:
      name: prepare-workspace
      values: { task_id: "{task_id}", task_title: "{task_title}" }
    outputs:
      - name: workspace-ref
        path: runtime/workspaces/{task_id}.yaml
        description: Location and branch of the isolated final-fix workspace

{% endif %}
  final-fix:
    description: Smart target applies the accepted final fixes.
    target: {{smart_target}}
    inputs:
      - name: final-decision
        path: runtime/decisions/{task_id}-final-decision.md
{% if fix_prepare != 'none' %}
      - name: workspace-ref
        path: runtime/workspaces/{task_id}.yaml
{% endif %}
    personality: |
      You are the final fix agent. Apply only the accepted fixes from the
      final decision. Do not broaden scope. If an accepted item turns out to
      require a much wider change than the final decision described, stop and
      record it as not fixed instead of expanding the patch.
    prompt_template:
      name: final-fix
      values: { task_id: "{task_id}", task_title: "{task_title}" }
    outputs:
      - name: final-fix-note
        path: runtime/fixes/{task_id}-final-fix.md
        description: Summary of final fixes applied by the smart target

{% if fix_commit != 'none' %}
  commit-fix:
    description: Smart target commits or publishes the final fixes ({{fix_commit}}).
    target: {{smart_target}}
    inputs:
      - name: final-fix-note
        path: runtime/fixes/{task_id}-final-fix.md
{% if fix_prepare != 'none' %}
      - name: workspace-ref
        path: runtime/workspaces/{task_id}.yaml
{% endif %}
    prompt_template:
      name: commit-fix
      values: { task_id: "{task_id}", task_title: "{task_title}" }
    outputs:
      - name: commit-ref
        path: runtime/commits/{task_id}.yaml
        description: Commit SHA and optional remote/PR reference

{% endif %}
  completed:
    description: Task is done.
    prompt_template:
      name: completed
      values: { task_id: "{task_id}" }
    final: true

  cancelled:
    description: Task was cancelled before completion.
    prompt_template:
      name: cancelled
      values: { task_id: "{task_id}" }
    final: true

transitions:
{% if fix_prepare != 'none' %}
  - {from: prepare-workspace, to: final-fix}
{% endif %}
{% if fix_commit != 'none' %}
  - {from: final-fix, to: commit-fix}
  - {from: commit-fix, to: completed}
{% else %}
  - {from: final-fix, to: completed}
{% endif %}
  - {from: '*', to: cancelled}
profiles:
  primary:
    initial: {% if fix_prepare == 'none' %}final-fix{% else %}prepare-workspace{% endif %}
    allowed: [{% if fix_prepare != 'none' %}prepare-workspace, {% endif %}final-fix, {% if fix_commit != 'none' %}commit-fix, {% endif %}completed, cancelled]
node_policy: {root: primary, default: primary}
