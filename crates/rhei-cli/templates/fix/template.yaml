name: fix
version: 1.0.0
description: Apply an approved code-review decision and optionally prepare and commit the work.
inputs:
  - name: fix_prepare
    description: Workspace preparation mode.
    type: string
    default: none
    validate: "^(none|branch|worktree|fork)$"
  - name: fix_commit
    description: Commit and publication mode.
    type: string
    default: none
    validate: "^(none|commit|push|pr)$"
  - name: smart_target
    description: Execution target that applies the fix.
    type: string
    format: execution-target
    default: fix-codex[xhigh]:openai:gpt-5.5
# Input-selected contracts omit absent stages. §FS-rhei-library.1.1 §FS-rhei-library.7.2
select: |
  ports:
    entry: {% if fix_prepare == 'none' %}final-fix{% else %}prepare-workspace{% endif %}
    exits: {done: completed, cancelled: cancelled}
  data:
    inputs:
      decision: {kind: state-file, state: {% if fix_prepare == 'none' %}final-fix{% else %}prepare-workspace{% endif %}, name: final-decision}
    outputs:
      {% if fix_prepare != 'none' %}
      workspace: {kind: state-file, state: prepare-workspace, name: workspace-ref}
      {% endif %}
      final-fix: {kind: state-file, state: final-fix, name: final-fix-note}
      {% if fix_commit != 'none' %}
      commit-ref: {kind: state-file, state: commit-fix, name: commit-ref}
      {% endif %}
