[package]
name = "rhei-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
description = "Core plan model and primitives for the Rhei agent runtime."
categories = ["development-tools"]
readme = "../../README.md"

[lib]
name = "rhei_core"
path = "src/lib.rs"

[features]
# Deterministic authority is linked only by the separately compiled e2e
# driver. The ordinary `rhei` binary never enables this feature.
budget-fixtures = []

[dependencies]
# Constrain serde_yaml's transitive resolver for Rust 1.82-compatible package verification.
indexmap = { version = "=2.2.6", features = ["serde"] }
# Pin broad TLS/URL ranges to the supported Cargo/Rust 1.82 toolchain.
zeroize = "=1.8.1"
url = "=2.5.2"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
time = { version = "=0.3.36", features = ["parsing", "formatting"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
fs2 = "0.4.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "=1.11.0", features = ["v4"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
