[package]
name = "rhei-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
description = "Native N-API implementation for Rhei API packages."
publish = false

[build-dependencies]
napi-build = "=2.2.3"

[lib]
name = "rhei_napi"
crate-type = ["cdylib"]
# The N-API shims resolve against the host Node process, which a test harness
# is not, and there are no unit tests here to lose. A run that selects the lib
# target explicitly — `--lib`, or `--all-targets` — overrides this, so `src/lib.rs`
# also compiles itself away under `cfg(test)`. #91
test = false

[dependencies]
rhei-core = { package = "rhei-plan", path = "../rhei-core", version = "=0.5.1-dev" }
napi = "2"
napi-derive = "2"
