name: shape-claiming-the-issue
version: 1

# The root-state shape of the claiming-the-issue pair: the claim is the first
# state of the ticket itself, `claim -> work`, and the ticket's own `work` then
# speaks for its subtree. `claim` is a program: it assigns the issue on the
# stand-in forge, `forge/issue-87.md`, and notes there what it found. The
# ticket is an ordinary parent, which runs only once its subtree is closed. The
# sibling shape keeps its own machine beside its plan.
#
# Every agent state runs the `mock` agent so the example runs with no
# credentials, and the program is the same Python file.

states:
  work:
    initial: true
    agent: mock
    description: Do the task's work and record why it ends where it does.
    instructions: |
      Do Task {task_id} as its body describes. Write every export its
      `**Provides:**` names before you finish, and your result last.

  claim:
    description: Assign the issue to this machine before anything is spent on it.
    program:
      command: ["python3", "workflow.py", "--program", "claim"]
    program_timeout: 1m

  completed:
    description: Done.
    final: true

  cancelled:
    description: Dropped. The reserved name, so a cancelled step owes no export.
    final: true

transitions:
  - from: work
    to: completed
    description: The work is done and its result written.

  - from: claim
    to: work
    exit_code: 0
    description: The issue is assigned; the ticket goes on to its own work.

  - from: "*"
    to: cancelled
    description: Dropped.
