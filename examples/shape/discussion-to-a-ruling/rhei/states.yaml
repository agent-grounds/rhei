name: shape-discussion-to-a-ruling
version: 1

# The project default machine of the `rhei` shape, which the `ticket` member
# inherits: the ticket's work is one agent state. The discussion is a member of
# its own with the machine beside its `index.rhei.md`, copied from
# `examples/agent-discussion`.
#
# Every state runs the `mock` agent so the example runs with no credentials.

states:
  work:
    initial: true
    agent: mock
    description: Do the task's work and record why it ends where it does.
    instructions: |
      Do Task {task_id} as its body describes, and write your result last.

  completed:
    description: Done.
    final: true

  cancelled:
    description: Dropped. The reserved name, so a cancelled step owes no export.
    final: true

transitions:
  - from: work
    to: completed
    description: The work is done and its result written.

  - from: "*"
    to: cancelled
    description: Dropped.
