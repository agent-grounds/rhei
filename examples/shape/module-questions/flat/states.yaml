name: shape-module-questions
version: 1

# One machine for both shapes of the module-questions pair: every task, the
# questions and the report alike, is one agent state. The shapes differ only
# in where the report sits: the parent of the questions in `nested`, a sibling
# after them in `flat`.
#
# Every state runs the `mock` agent so the example runs with no credentials.

states:
  work:
    initial: true
    agent: mock
    description: Do the task's work and record why it ends where it does.
    instructions: |
      Do Task {task_id} as its body describes, and write your result last.

  completed:
    description: Done.
    final: true

  cancelled:
    description: Dropped. The reserved name, so a cancelled step owes no export.
    final: true

transitions:
  - from: work
    to: completed
    description: The work is done and its result written.

  - from: "*"
    to: cancelled
    description: Dropped.
