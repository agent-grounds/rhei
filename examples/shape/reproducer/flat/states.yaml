name: shape-reproducer
version: 1

# One machine for both shapes of the reproducer pair, so the only difference
# between them is where the reproduction sits in the plan: a sibling task of its
# own (flat) or a child of triage (nested). The machine has one working state on
# purpose — the third shape, the reproduction as a state inside triage, is the
# one the memory test rules out, and the README says why.
#
# Every state runs the `mock` agent so the example runs with no credentials.

states:
  work:
    initial: true
    agent: mock
    description: Do the task's work and record why it ends where it does.
    instructions: |
      Do Task {task_id} as its body describes. Write every export its
      `**Provides:**` names before you finish, and your result last.

  completed:
    description: Done.
    final: true

  cancelled:
    description: Dropped. The reserved name, so a cancelled step owes no export.
    final: true

transitions:
  - from: work
    to: completed
    description: The work is done and its result written.

  - from: "*"
    to: cancelled
    description: Dropped.
