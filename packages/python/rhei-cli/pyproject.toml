[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhei-cli"
version = "0.5.1-dev"
description = "Command-line driver for the Rhei agent runtime."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [
  { name = "Rhei contributors" }
]
keywords = ["agents", "markdown", "planning", "workflow", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development"
]

[project.urls]
Homepage = "https://github.com/agent-grounds/rhei"
Repository = "https://github.com/agent-grounds/rhei"
Issues = "https://github.com/agent-grounds/rhei/issues"

[project.scripts]
# Both names dispatch to the same CLI. §FS-rhei-distribution.1
rhei = "rhei_cli:main"
rh = "rhei_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
