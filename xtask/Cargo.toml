[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false
license.workspace = true

[dependencies]
rhei-core = { package = "rhei-plan", path = "../crates/rhei-core", version = "=0.5.0" }
# The visualization subsystems live inside the CLI library since the publish
# set collapsed to `rhei-plan` and `rhei-cli`. §FS-rhei-distribution.1
rhei-cli = { path = "../crates/rhei-cli", version = "=0.5.0" }

[[bin]]
name = "xtask"
path = "src/main.rs"
